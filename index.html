<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lucifer Database X — Sovereign Media Index</title>
    <meta name="title" content="Lucifer Database X — Sovereign Media Index" />
    <meta
      name="description"
      content="Verified scan telemetry for the Lucifer media fleet: 1,948,083 indexed files, 1,654.24 TB across two channel archives."
    />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="author" content="Lucifer Open Source" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lucifer Database X — Sovereign Media Index" />
    <meta
      property="og:description"
      content="Verified scan telemetry for the Lucifer media fleet: 1,948,083 indexed files, 1,654.24 TB across two channel archives."
    />

    <!-- Self-hosted webfonts: no third-party requests at runtime. -->
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <script>
      // Resolve appearance (mode, accent, font) before first paint — no flash.
      (function () {
        var root = document.documentElement
        try {
          var mode = localStorage.getItem('lx-theme')
          root.dataset.theme =
            mode === 'light' || mode === 'dark'
              ? mode
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
        } catch (error) {
          root.dataset.theme = 'dark'
        }
        try {
          root.dataset.accent = localStorage.getItem('lx-accent') || 'blue'
          root.dataset.font = localStorage.getItem('lx-font') || 'grotesk'
        } catch (error) {
          root.dataset.accent = 'blue'
          root.dataset.font = 'grotesk'
        }
        try {
          root.dataset.glass = localStorage.getItem('lx-glass') === 'on' ? 'on' : 'off'
          root.style.setProperty('--glass-pct', localStorage.getItem('lx-glass-pct') || '40')
        } catch (error) {
          root.dataset.glass = 'off'
          root.style.setProperty('--glass-pct', '40')
        }
        try {
          root.dataset.density = localStorage.getItem('lx-density') || 'comfortable'
          root.dataset.size = localStorage.getItem('lx-size') || 'md'
          root.dataset.wallpaper = localStorage.getItem('lx-wallpaper') || 'mesh'
          root.dataset.sidebar = localStorage.getItem('lx-sidebar') || 'shown'
        } catch (error) {
          root.dataset.density = 'comfortable'
          root.dataset.size = 'md'
          root.dataset.wallpaper = 'mesh'
          root.dataset.sidebar = 'shown'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
