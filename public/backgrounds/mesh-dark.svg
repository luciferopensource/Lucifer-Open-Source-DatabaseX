<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dark aurora mesh">
  <defs>
    <radialGradient id="base" cx="46%" cy="8%" r="100%">
      <stop offset="0" stop-color="#152036" />
      <stop offset="0.5" stop-color="#0a0e18" />
      <stop offset="1" stop-color="#04060b" />
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="76%">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.6" />
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9dc2ff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#9dc2ff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#9dc2ff" stop-opacity="0" />
    </linearGradient>
    <filter id="wide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="105" />
    </filter>
    <filter id="mid" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48" />
    </filter>
    <filter id="bokeh" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="streakBlur" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)" />

  <g filter="url(#wide)">
    <circle cx="250" cy="140" r="300" fill="#24437a" opacity="0.72" />
    <circle cx="1230" cy="80" r="330" fill="#155a70" opacity="0.62" />
    <circle cx="1460" cy="780" r="370" fill="#3d2a6b" opacity="0.68" />
    <circle cx="520" cy="920" r="330" fill="#0f4256" opacity="0.58" />
    <circle cx="880" cy="430" r="230" fill="#6b5320" opacity="0.32" />
  </g>

  <g filter="url(#streakBlur)" opacity="0.85">
    <rect x="120" y="180" width="900" height="70" fill="url(#streak)" transform="rotate(-18 570 215)" />
    <rect x="640" y="700" width="820" height="54" fill="url(#streak)" transform="rotate(-14 1050 727)" opacity="0.7" />
  </g>

  <!-- Defined bokeh: this is what the glass visibly smears. -->
  <g filter="url(#bokeh)">
    <circle cx="1040" cy="620" r="96" fill="#8fb2ff" opacity="0.5" />
    <circle cx="1180" cy="500" r="52" fill="#dce8ff" opacity="0.45" />
    <circle cx="360" cy="520" r="78" fill="#7fe3d4" opacity="0.42" />
    <circle cx="470" cy="360" r="38" fill="#c6fff2" opacity="0.35" />
    <circle cx="1330" cy="300" r="88" fill="#c9b3ff" opacity="0.45" />
    <circle cx="1440" cy="450" r="46" fill="#e9dcff" opacity="0.4" />
    <circle cx="690" cy="200" r="64" fill="#ffd79a" opacity="0.3" />
    <circle cx="180" cy="760" r="70" fill="#9fd8ff" opacity="0.38" />
    <circle cx="870" cy="840" r="58" fill="#e6d9ff" opacity="0.36" />
    <circle cx="1290" cy="860" r="40" fill="#ffffff" opacity="0.3" />
  </g>

  <g filter="url(#mid)" opacity="0.5">
    <circle cx="600" cy="640" r="140" fill="#3c6bb8" opacity="0.35" />
    <circle cx="1500" cy="140" r="120" fill="#2f7f96" opacity="0.3" />
  </g>

  <g opacity="0.7">
    <circle cx="1080" cy="330" r="14" fill="#ffffff" opacity="0.55" />
    <circle cx="420" cy="700" r="10" fill="#dcecff" opacity="0.5" />
    <circle cx="1360" cy="620" r="12" fill="#e8dcff" opacity="0.5" />
    <circle cx="760" cy="120" r="8" fill="#ffffff" opacity="0.45" />
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)" />
</svg>
